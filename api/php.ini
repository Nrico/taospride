; GoDaddy shared hosting — PHP limits for image uploads
; This file overrides cPanel defaults for the api/ directory.
; ini_set() in PHP code cannot raise post_max_size — only this file can.

post_max_size       = 32M
upload_max_filesize = 32M
memory_limit        = 256M
max_execution_time  = 120
max_input_time      = 120
